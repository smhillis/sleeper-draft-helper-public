name: Apply strict Sleeper league scoring safeguards

on:
  push:
    branches:
      - feature/strict-league-scoring-only
    paths:
      - .github/workflows/strict-scoring-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strict-league-scoring-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Enforce league-only scoring in production engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text()

          replacements = {
            "function leaguePoints(p) {\n  if (!p) return 0;\n  const s = state.league?.scoring_settings || {};": "function leagueScoringReady() {\n  return Object.entries(state.league?.scoring_settings || {}).some(([, value]) => Number.isFinite(Number(value)) && Number(value) !== 0);\n}\n\nfunction leaguePoints(p) {\n  if (!p || !leagueScoringReady()) return null;\n  const s = state.league?.scoring_settings || {};",
            "  return matched ? points : baselinePoints(p);": "  return matched ? points : null;",
            "    return base > 0 ? { name: player.name, pos: normalizePos(player.pos), ratio: league / base } : null;": "    return base > 0 && Number.isFinite(league) ? { name: player.name, pos: normalizePos(player.pos), ratio: league / base } : null;",
            "function recommendations() {\n  const gone = new Set": "function recommendations() {\n  if (!leagueScoringReady()) return [];\n  const gone = new Set",
            ".filter((p) => !gone.has(norm(p.name)) && candidateAllowed(p, targets))": ".filter((p) => !gone.has(norm(p.name)) && candidateAllowed(p, targets) && scoring.has(norm(p.name)))",
            "function scoringSummary() {\n  const s = state.league?.scoring_settings || {};": "function scoringSummary() {\n  if (!leagueScoringReady()) return 'League scoring unavailable';\n  const s = state.league?.scoring_settings || {};",
            "    scoringCoverage,\n    recommendations,": "    scoringCoverage,\n    leagueScoringReady,\n    recommendations,",
            "  $('pickCards').innerHTML = cards ? `${cards}${showMore}` : '<p>No recommendation available.</p>';": "  $('pickCards').innerHTML = cards ? `${cards}${showMore}` : `<p>${leagueScoringReady() ? 'No fully league-scored recommendation is available.' : 'Waiting for verified Sleeper league scoring. No fallback scoring is used.'}</p>`;",
            "    if (!user?.user_id) throw new Error('Sleeper username not found.');\n    state.username = user.username || username; state.leagueId = leagueId; state.user = user; state.league = league; state.rosters = rosters || [];": "    if (!user?.user_id) throw new Error('Sleeper username not found.');\n    const activeScoring = Object.entries(league?.scoring_settings || {}).filter(([, value]) => Number.isFinite(Number(value)) && Number(value) !== 0);\n    if (!activeScoring.length) throw new Error('Sleeper did not return active scoring settings for this league. Recommendations are withheld; no fallback scoring is used.');\n    state.username = user.username || username; state.leagueId = leagueId; state.user = user; state.league = league; state.rosters = rosters || [];",
            "    const [league, drafts, rosters] = await Promise.all([j(`${API}/league/${state.leagueId}`), j(`${API}/league/${state.leagueId}/drafts`), j(`${API}/league/${state.leagueId}/rosters`)]);\n    state.league = league; state.rosters = rosters || [];": "    const [league, drafts, rosters] = await Promise.all([j(`${API}/league/${state.leagueId}`), j(`${API}/league/${state.leagueId}/drafts`), j(`${API}/league/${state.leagueId}/rosters`)]);\n    const activeScoring = Object.entries(league?.scoring_settings || {}).filter(([, value]) => Number.isFinite(Number(value)) && Number(value) !== 0);\n    if (!activeScoring.length) throw new Error('Sleeper league scoring is unavailable. Keeping recommendations withheld rather than using fallback scoring.');\n    state.league = league; state.rosters = rosters || [];"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected snippet not found: {old[:120]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/strict-scoring-patch.yml').unlink()
          PY
      - name: Install
        run: npm install
      - name: Syntax
        run: node --check app.js
      - name: Validate draft engine
        run: npm run validate:draft-engine
      - name: Commit safeguards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/strict-scoring-patch.yml
          git commit -m "Enforce verified Sleeper league scoring only"
          git push origin HEAD:feature/strict-league-scoring-only
